name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-consistency:
    name: 코드 일관성 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: fetchExchangeRate AbortController 타임아웃 확인
        run: |
          if grep -q "AbortController" index.html && grep -q "15000" index.html; then
            echo "✅ AbortController 15초 타임아웃 존재"
          else
            echo "❌ AbortController 또는 15000ms 타임아웃 미존재"
            exit 1
          fi

      - name: _fetchRateBusy 연타방지 플래그 확인
        run: |
          if grep -q "_fetchRateBusy" index.html; then
            echo "✅ _fetchRateBusy 플래그 존재"
          else
            echo "❌ _fetchRateBusy 플래그 미존재 — 연타방지 로직 삭제됨"
            exit 1
          fi

      - name: fetchExchangeRate 함수 존재 확인
        run: |
          if grep -q "async function fetchExchangeRate" index.html; then
            echo "✅ fetchExchangeRate 함수 존재"
          else
            echo "❌ fetchExchangeRate 함수 미존재"
            exit 1
          fi

      - name: 환율 API fallback 3단계 확인
        run: |
          if grep -q "/api/rate" index.html; then
            echo "✅ 환율 API 엔드포인트 존재"
          else
            echo "❌ /api/rate 엔드포인트 미존재"
            exit 1
          fi

      - name: 환율 수신 실패 안내 잔존 확인 (v=20260907f)
        run: |
          for pat in "_crFailNotice" "_crEnsureStyle"; do
            if grep -qF "$pat" index.html; then
              echo "✅ $pat 존재"
            else
              echo "❌ $pat 미존재 — 환율 실패 안내 회귀(실패해도 무동작으로 되돌아감)"
              exit 1
            fi
          done

      - name: 리포트 출력 기능 잔존 확인 (v=20260907e 공개)
        run: |
          for pat in "var FEATURE_CALC_REPORT = true" "_crInit" "_crBuildReportHtml" "_CR_SPECS" "cr-tablewrap" "_crFlagOverride"; do
            if grep -qF "$pat" index.html; then
              echo "✅ $pat 존재"
            else
              echo "❌ $pat 미존재 — 리포트 출력 회귀"
              exit 1
            fi
          done

      - name: 초기화 버튼·확인 모달 잔존 확인 (v=20260907e 공개)
        run: |
          for pat in "var FEATURE_CALC_RESET = true" "_crResetTab" "_crResetTabApply" "_crModal" "_crShowUndo" "cr-btn-reset"; do
            if grep -qF "$pat" index.html; then
              echo "✅ $pat 존재"
            else
              echo "❌ $pat 미존재 — 초기화 버튼 회귀"
              exit 1
            fi
          done

  site-health:
    name: 사이트 접속 확인
    runs-on: ubuntu-latest
    steps:
      - name: pro-financecalculator.vercel.app 접속
        run: |
          curl -f --max-time 15 --retry 3 --retry-delay 5 \
            -o /dev/null -s -w "HTTP %{http_code}\n" \
            https://pro-financecalculator.vercel.app
          echo "✅ pro-financecalculator.vercel.app 정상"
